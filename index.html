<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happ Proxy Utility - License System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
    }

    /* แถบหัวข้อและจุดไฟสถานะ */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .header-title {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #aaa;
      background: #161616;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #2a2a2a;
    }

    /* จุดไฟสถานะพื้นฐาน */
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      position: relative;
    }

    /* 1. ไฟสีขาว (รอยืนยัน - หายใจเข้าออก) */
    .dot.neutral {
      background-color: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
      animation: pulse-neutral 2s infinite ease-in-out;
    }

    @keyframes pulse-neutral {
      0%, 100% {
        opacity: 0.3;
        box-shadow: 0 0 2px rgba(255, 255, 255, 0.3);
      }
      50% {
        opacity: 1;
        box-shadow: 0 0 10px rgba(255, 255, 255, 1);
      }
    }

    /* 2. ไฟสีเขียว (ผ่าน - วงแหวนวาบออก) */
    .dot.success {
      background-color: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    .dot.success::after {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      border-radius: 50%;
      border: 2px solid #00e676;
      animation: pulse-ring 1.5s infinite ease-out;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.8);
        opacity: 1;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    /* 3. ไฟสีแดง (ไม่ผ่าน - สั่นสะเทือน) */
    .dot.error {
      background-color: #ff5252;
      box-shadow: 0 0 10px #ff5252;
      animation: shake 0.4s ease-in-out, pulse-red 1.2s infinite ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 4px #ff5252; }
      50% { box-shadow: 0 0 14px #ff5252; }
    }

    /* ฟอร์มและอินพุต */
    .info-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ip-display {
      background: #161616;
      border: 1px solid #2a2a2a;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.95rem;
      color: #ccc;
    }

    input[type="text"] {
      width: 100%;
      background: #161616;
      border: 1px solid #333;
      color: #fff;
      padding: 12px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #555;
    }

    button {
      width: 100%;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #3a3a3a;
      padding: 13px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #333;
      border-color: #555;
    }

    .message {
      margin-top: 16px;
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 6px;
      display: none;
    }

    .message.error {
      display: block;
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid rgba(255, 82, 82, 0.3);
      color: #ff5252;
    }

    .message.success {
      display: block;
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: #00e676;
    }

    /* รายการคีย์ของฉัน */
    .my-keys-section {
      margin-top: 24px;
      border-top: 1px solid #2a2a2a;
      padding-top: 18px;
    }

    .my-keys-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .my-keys-title {
      font-size: 0.78rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .my-keys-count {
      font-size: 0.78rem;
      color: #666;
    }

    .key-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 140px;
      overflow-y: auto;
    }

    .key-item {
      background: #161616;
      border: 1px solid #2a2a2a;
      padding: 10px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .key-value {
      font-family: monospace;
      font-size: 0.85rem;
      color: #00e676;
    }

    .key-time {
      font-size: 0.75rem;
      color: #666;
    }

    .empty-state {
      font-size: 0.82rem;
      color: #555;
      text-align: center;
      padding: 14px 0;
      border: 1px dashed #2a2a2a;
      border-radius: 6px;
    }

    /* หน้าเชื่อมต่อ Happ Proxy (หน้าที่ 2) */
    .view-vpn {
      display: none;
      text-align: center;
    }

    .vpn-card {
      background: #161616;
      border: 1px solid #2a2a2a;
      padding: 24px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .app-icon {
      width: 56px;
      height: 56px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 12px auto;
    }

    .app-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .app-desc {
      font-size: 0.8rem;
      color: #888;
    }

    .btn-connect {
      background: #00e676;
      color: #000;
      font-weight: 600;
      border: none;
      padding: 14px;
      margin-bottom: 10px;
    }

    .btn-connect:hover {
      background: #00c853;
    }

    .btn-back {
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
    }

    .btn-back:hover {
      background: #222;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- หน้าที่ 1: หน้ากรอกยืนยันคีย์ -->
    <div id="verifyView">
      <div class="header">
        <div class="header-title">ยืนยันสิทธิ์ใช้งาน</div>
        <div class="status-badge">
          <span class="dot neutral" id="statusDot"></span>
          <span id="statusText">รอยืนยัน</span>
        </div>
      </div>

      <div class="info-group">
        <label>IP เครื่องปัจจุบัน</label>
        <div class="ip-display" id="userIp">กำลังดึงข้อมูล IP...</div>
      </div>

      <div class="info-group">
        <label for="keyInput">License Key (24 หลัก)</label>
        <input type="text" id="keyInput" placeholder="HAPP-XXXX-XXXX-XXXX-XXXX-XXXX" maxlength="29" autocomplete="off">
      </div>

      <button id="verifyBtn" onclick="verifyKey()">ยืนยันและผูก IP</button>

      <div class="message" id="msgBox"></div>

      <div class="my-keys-section">
        <div class="my-keys-header">
          <span class="my-keys-title">คีย์ที่ผูกไว้กับเครื่องนี้</span>
          <span class="my-keys-count" id="keyCount">ผูกไว้แล้ว 0 คีย์</span>
        </div>
        <div class="key-list" id="keyList">
          <div class="empty-state">ยังไม่มีคีย์ที่ถูกผูกไว้กับเครื่องนี้</div>
        </div>
      </div>
    </div>

    <!-- หน้าที่ 2: หน้ากดเชื่อมต่อและเปิดแอป Happ Proxy Utility -->
    <div id="vpnView" class="view-vpn">
      <div class="header">
        <div class="header-title">เชื่อมต่อแอปการใช้งาน</div>
        <div class="status-badge">
          <span class="dot success"></span>
          <span style="color: #00e676;">สิทธิ์ถูกต้อง</span>
        </div>
      </div>

      <div class="vpn-card">
        <div class="app-icon">🚀</div>
        <div class="app-name">Happ - Proxy Utility</div>
        <div class="app-desc">ระบบพร้อมเชื่อมต่อและเปิดแอปในมือถืออัตโนมัติ</div>
      </div>

      <button class="btn-connect" onclick="connectAndLaunchHapp()">
        📱 เชื่อมต่อและเปิด Happ Proxy Utility
      </button>

      <button class="btn-back" onclick="switchView('verifyView')">
        ← ย้อนกลับหน้ายืนยันคีย์
      </button>

      <div class="message" id="vpnMsg"></div>
    </div>
  </div>

  <script>
    let currentIp = "127.0.0.1";

    // URI Scheme สำหรับเรียกเปิดแอป Happ - Proxy Utility บน Android / iOS
    const HAPP_APP_SCHEME = "happ://import"; 

    // ตั้งค่าคีย์ใช้งานจริง 5 คีย์เข้าสู่ระบบ LocalStorage
    function initSystem() {
      if (!localStorage.getItem('system_keys_db')) {
        const adminKeys = {
          "HAPP-8F3A-921B-C401-2026-X7Y9": { boundIp: null },
          "HAPP-1E7D-5502-B89A-33C4-M2N8": { boundIp: null },
          "HAPP-0941-K822-P901-44EF-Z1A3": { boundIp: null },
          "HAPP-7720-B11C-88A9-6632-Q5W8": { boundIp: null },
          "HAPP-3A9B-4C2D-1E00-9988-V4K6": { boundIp: null }
        };
        localStorage.setItem('system_keys_db', JSON.stringify(adminKeys));
      }

      if (!localStorage.getItem('my_activated_keys')) {
        localStorage.setItem('my_activated_keys', JSON.stringify([]));
      }
    }

    // ดึงข้อมูล IP จริงของเครื่องผู้ใช้
    async function fetchIp() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        currentIp = data.ip;
      } catch (err) {
        currentIp = "192.168.1." + Math.floor(Math.random() * 200 + 10);
      }
      document.getElementById('userIp').innerText = currentIp;
    }

    // แสดงรายการคีย์ของฉันที่ผูกเรียบร้อยแล้ว
    function renderMyKeys() {
      const myKeys = JSON.parse(localStorage.getItem('my_activated_keys') || '[]');
      const listContainer = document.getElementById('keyList');
      const countDisplay = document.getElementById('keyCount');

      countDisplay.innerText = `ผูกไว้แล้ว ${myKeys.length} คีย์`;

      if (myKeys.length === 0) {
        listContainer.innerHTML = `<div class="empty-state">ยังไม่มีคีย์ที่ถูกผูกไว้กับเครื่องนี้</div>`;
        return;
      }

      listContainer.innerHTML = myKeys.map(item => `
        <div class="key-item">
          <span class="key-value">${item.key}</span>
          <span class="key-time">${item.date}</span>
        </div>
      `).join('');
    }

    // ฟังก์ชันตรวจสอบคีย์และผูก IP
    function verifyKey() {
      const keyInput = document.getElementById('keyInput').value.trim().toUpperCase();

      if (!keyInput) {
        showStatus('error', 'กรุณากรอก License Key');
        return;
      }

      const systemDb = JSON.parse(localStorage.getItem('system_keys_db') || '{}');
      const myKeys = JSON.parse(localStorage.getItem('my_activated_keys') || '[]');

      // ตรวจสอบคีย์ใน Database
      if (!(keyInput in systemDb)) {
        showStatus('error', 'ไม่พบ License Key นี้ในระบบ');
        return;
      }

      const keyData = systemDb[keyInput];

      // เช็คการผูก IP
      if (keyData.boundIp && keyData.boundIp !== currentIp) {
        showStatus('error', `คีย์นี้ถูกผูกไว้กับ IP อื่นแล้ว (${keyData.boundIp})`);
        return;
      }

      const isAlreadyAdded = myKeys.some(k => k.key === keyInput);
      
      // บันทึกการผูก IP
      systemDb[keyInput].boundIp = currentIp;
      localStorage.setItem('system_keys_db', JSON.stringify(systemDb));

      if (!isAlreadyAdded) {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        myKeys.unshift({ key: keyInput, date: timeStr });
        localStorage.setItem('my_activated_keys', JSON.stringify(myKeys));
      }

      showStatus('success', 'ยืนยันและผูก IP สำเร็จ! กำลังสลับไปหน้าเชื่อมต่อ...');
      renderMyKeys();

      // สลับไปหน้าเชื่อมต่อแอป
      setTimeout(() => {
        switchView('vpnView');
      }, 1200);
    }

    // อัปเดตสถานะจุดไฟและข้อความ
    function showStatus(type, text) {
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const msgBox = document.getElementById('msgBox');

      dot.className = 'dot ' + (type === 'success' ? 'success' : 'error');
      statusText.innerText = type === 'success' ? 'ยืนยันสำเร็จ' : 'ไม่สำเร็จ';
      statusText.style.color = type === 'success' ? '#00e676' : '#ff5252';

      msgBox.className = 'message ' + type;
      msgBox.innerText = text;
    }

    // สลับหน้าจอระหว่าง หน้าสิทธิ์ กับ หน้าแอป
    function switchView(viewId) {
      document.getElementById('verifyView').style.display = viewId === 'verifyView' ? 'block' : 'none';
      document.getElementById('vpnView').style.display = viewId === 'vpnView' ? 'block' : 'none';
      
      const vpnMsg = document.getElementById('vpnMsg');
      vpnMsg.style.display = 'none';
    }

    // สั่งเชื่อมต่อและเด้งเปิดแอป Happ Proxy Utility ในมือถือ
    function connectAndLaunchHapp() {
      const vpnMsg = document.getElementById('vpnMsg');
      vpnMsg.className = 'message success';
      vpnMsg.innerText = 'กำลังเปิดแอป Happ Proxy Utility...';
      vpnMsg.style.display = 'block';

      setTimeout(() => {
        window.location.href = HAPP_APP_SCHEME;
      }, 500);
    }

    // เริ่มทำงานเมื่อเปิดหน้าเว็บ
    initSystem();
    fetchIp();
    renderMyKeys();
  </script>
</body>
</html>
